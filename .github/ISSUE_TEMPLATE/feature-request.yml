name: 🚀 Sugerir uma melhoria
description: Sugerir uma ideia, funcionalidade ou melhoria para o HubCli
title: "[FEATURE]: "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        HubCli é um fork focado em curadoria de modelos, diagnóstico, perfis de
        roteamento e MCP. Melhorias no núcleo do agente normalmente fazem mais
        sentido no projeto original: https://github.com/anomalyco/opencode

  - type: textarea
    id: description
    attributes:
      label: O que você gostaria
      description: O que quer mudar ou adicionar, e por quê. Quanto mais concreto, melhor.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas que você considerou
      description: Existe alguma forma de fazer isso hoje? O que falta nela?
    validations:
      required: false
