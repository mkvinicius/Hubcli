# HubCli CI — separate from OpenCode's own upstream workflows (test.yml,
# typecheck.yml, publish.yml, etc.) so that future `hubcli maintenance sync`
# merges from upstream/dev never conflict on filename. Only exercises
# HubCli-added code paths (hubcli/, doctor, MCP, profiles) plus the shared
# opencode/tui typechecks.
#
# AUTHORED IN THIS SESSION, NOT YET RUN ON A REAL GITHUB ACTIONS RUNNER —
# there was no CI access available (no push was made to trigger it). Review
# the matrix and steps before relying on it; treat as a draft until it has
# gone green at least once.
#
# Two-job design per platform:
#   build   — checks out the repo, builds + packages (script/hubcli/release/),
#             uploads the packaged archive as an artifact.
#   verify  — a SEPARATE job/runner that does NOT check out the repository at
#             all. It only downloads the artifact from `build` and runs the
#             extracted binaries. Because it is a fresh VM with no checkout,
#             this is a structural (not just behavioral) proof that the
#             package does not depend on the repo, node_modules, Bun, Git, or
#             any path from the build runner — if it did, `verify` would fail
#             outright (file not found / command not found), not just print
#             a warning.
name: hubcli-ci

on:
  push:
    branches: [integration/upstream-20260702]
  pull_request:
    branches: [integration/upstream-20260702]
  workflow_dispatch: {}

concurrency:
  group: hubcli-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-and-unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install
      - run: bun run --filter opencode typecheck
      - run: bun run --filter @opencode-ai/tui typecheck

      - name: HubCli tests (doctor, hubcli/)
        # No real provider credentials are configured in CI — these tests use
        # fixtures/fake keys only (verified by the secret-scan step below),
        # never live network calls to Zen/DeepSeek/NVIDIA/etc.
        working-directory: packages/opencode
        run: bun test test/cli/cmd/doctor.test.ts test/cli/hubcli/ --timeout 60000

      - name: secret scan (fail on obvious leaked key patterns)
        if: runner.os == 'Linux'
        shell: bash
        run: bash script/hubcli/release/scan-secrets.sh

  build:
    needs: typecheck-and-unit-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install

      - name: build + package ${{ matrix.target }} (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash script/hubcli/release/build-platform.sh ${{ matrix.target }}
          bash script/hubcli/release/package-platform.sh ${{ matrix.target }} dist-release

      - name: build + package ${{ matrix.target }} (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & script/hubcli/release/build-platform.ps1 -Target ${{ matrix.target }}
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) { throw "build-platform.ps1 failed with exit code $buildExitCode" }
          & script/hubcli/release/package-platform.ps1 -Target ${{ matrix.target }} -OutDir dist-release
          $packageExitCode = $LASTEXITCODE
          if ($packageExitCode -ne 0) { throw "package-platform.ps1 failed with exit code $packageExitCode" }

      - uses: actions/upload-artifact@v4
        with:
          name: hubcli-ci-package-${{ matrix.target }}
          path: dist-release/*
          retention-days: 3

  # Fresh runner, NO checkout of the repository. If the package secretly
  # depends on the source tree, Bun, Git, or a build-machine path, these
  # steps fail with a plain "not found" — not a judgment call.
  verify-package:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hubcli-ci-package-${{ matrix.target }}
          path: pkg-download

      - name: extract package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/extracted"
          tar -xzf pkg-download/hubcli-${{ matrix.target }}.tar.gz -C "${RUNNER_TEMP}/extracted"
          echo "PKG_DIR=${RUNNER_TEMP}/extracted/hubcli-${{ matrix.target }}" >> "$GITHUB_ENV"

      - name: extract package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "extracted"
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Expand-Archive -Path "pkg-download/hubcli-${{ matrix.target }}.zip" -DestinationPath $dest -Force
          "PKG_DIR=$dest\hubcli-${{ matrix.target }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: confirm bun/git are not required (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          export PATH="/usr/bin:/bin"
          command -v bun && { echo "bun unexpectedly still on a minimal PATH — not a useful negative test here, continuing anyway"; } || echo "confirmed: bun not on PATH for this step"
          command -v git && { echo "git present on minimal PATH (system git) — package must not require it anyway"; } || echo "confirmed: git not on PATH for this step"
          "${PKG_DIR}/hubcli" --version

      - name: run version/help/profile/doctor/mcp (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          HOME: ${{ runner.temp }}/fake-home-${{ matrix.target }}
        run: |
          mkdir -p "$HOME"
          "${PKG_DIR}/hubcli" --version
          "${PKG_DIR}/hubcli" --help >/dev/null
          "${PKG_DIR}/hubcli" profile list || true   # no ~/.hubcli/profiles.json yet on a bare install — must not crash
          "${PKG_DIR}/hubcli" doctor || true         # missing config/credentials is expected to WARN, not crash
          "${PKG_DIR}/hubcli" doctor --mcp || true

      - name: run version/help/profile/doctor/mcp (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          USERPROFILE: ${{ runner.temp }}\fake-home-windows
        run: |
          New-Item -ItemType Directory -Path $env:USERPROFILE -Force | Out-Null
          $parserTokens = $null
          $parserErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$env:PKG_DIR\hubcli.ps1",
            [ref]$parserTokens,
            [ref]$parserErrors
          ) | Out-Null
          if ($parserErrors.Count -gt 0) {
            $parserErrors | Format-List
            exit 1
          }
          & "$env:PKG_DIR\hubcli.cmd" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "$env:PKG_DIR\hubcli.cmd" --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          function Invoke-HubCliDiagnostic(
            [string[]]$CommandArgs,
            [int[]]$AllowedExitCodes
          ) {
            & "$env:PKG_DIR\hubcli.cmd" @CommandArgs
            $code = $LASTEXITCODE
            if ($code -notin $AllowedExitCodes) {
              throw "Unexpected exit code $code for: hubcli $($CommandArgs -join ' ')"
            }
            $global:LASTEXITCODE = 0
          }
          Invoke-HubCliDiagnostic -CommandArgs @("profile", "list") -AllowedExitCodes @(0)
          Invoke-HubCliDiagnostic -CommandArgs @("doctor") -AllowedExitCodes @(0, 1, 2)
          Invoke-HubCliDiagnostic -CommandArgs @("doctor", "--mcp") -AllowedExitCodes @(0, 1, 2, 4)

      - name: deterministic check — no personal/build-machine path leaked (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN=$(find "${PKG_DIR:-pkg-download}" -iname "hubcli-runtime*" -type f 2>/dev/null | head -1)
          if [ -z "$BIN" ]; then BIN=$(find pkg-download -iname "hubcli-runtime*" -type f | head -1); fi
          if command -v strings >/dev/null 2>&1; then
            LEAKED=$(strings -a "$BIN" 2>/dev/null | grep -E "/(Users|home)/[a-zA-Z0-9_.-]+/(Hubcli|Documents|Desktop)" || true)
            if [ -n "$LEAKED" ]; then
              echo "$LEAKED"
              echo "Personal/developer path found embedded in the packaged binary — see docs/SECURITY.md."
              exit 1
            fi
            echo "No personal-looking path pattern found in $BIN"
          else
            echo "strings not available on this runner — skipping (documented limitation)"
          fi

      - name: deterministic check — no personal/build-machine path leaked (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Get-ChildItem -Path $env:PKG_DIR -Filter "hubcli-runtime*.exe" -File | Select-Object -First 1
          if (-not $binary) { throw "hubcli-runtime.exe not found in extracted package" }
          $text = [Text.Encoding]::UTF8.GetString([IO.File]::ReadAllBytes($binary.FullName))
          if ($text -match '/Users/[A-Za-z0-9_.-]+/(Hubcli|Documents|Desktop)') {
            throw "Personal/developer path found embedded in $($binary.FullName)"
          }

      - name: deterministic check — package has no secrets/source/.git (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -f pkg-download/hubcli-${{ matrix.target }}.tar.gz -o -f pkg-download/hubcli-${{ matrix.target }}.zip
          ! find "$PKG_DIR" \( -iname "credentials.env" -o -iname "auth.json" -o -iname ".git" -o -iname "node_modules" \) | grep -q . || (echo "forbidden file found in package" && exit 1)
          ! grep -rEan "sk-[A-Za-z0-9]{20,}|nvapi-[A-Za-z0-9_-]{20,}|(DASHSCOPE|DEEPSEEK|NVIDIA)_API_KEY[[:space:]]*[=:][[:space:]]*[\"']?[A-Za-z0-9_./+=-]{12,}" "$PKG_DIR" || (echo "possible secret literal found in package" && exit 1)

      - name: deterministic check — package has no secrets/source/.git (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "pkg-download/hubcli-${{ matrix.target }}.zip")) {
            throw "Expected Windows package archive was not downloaded"
          }
          $forbidden = Get-ChildItem -Path $env:PKG_DIR -Recurse -Force |
            Where-Object { $_.Name -in @("credentials.env", "auth.json", ".git", "node_modules") }
          if ($forbidden) {
            $forbidden.FullName | Write-Output
            throw "Forbidden file or directory found in package"
          }
          $secretPattern = 'sk-[A-Za-z0-9]{20,}|nvapi-[A-Za-z0-9_-]{20,}|(DASHSCOPE|DEEPSEEK|NVIDIA)_API_KEY\s*[=:]\s*["'']?[A-Za-z0-9_./+=-]{12,}'
          $secretHits = Get-ChildItem -Path $env:PKG_DIR -Recurse -File |
            Select-String -Pattern $secretPattern -ErrorAction SilentlyContinue
          if ($secretHits) {
            $secretHits | Write-Output
            throw "Possible secret literal found in package"
          }

  # Runs the actual installers (install.sh / install.ps1) end to end, against
  # the package built by `build` above. Until this job existed the installers
  # were only ever *copied* into releases, never executed anywhere — which is
  # how a Windows install could be shipped broken without CI noticing.
  #
  # Uses HUBCLI_INSTALL_SOURCE so the installer reads the freshly built
  # archive from disk instead of a published GitHub release (there is no
  # release for an arbitrary CI commit). Every other code path — checksum
  # verification, extraction, atomic install, smoke test, PATH handling,
  # --check/--repair/--uninstall, config preservation — is the real one.
  verify-installer:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-latest
          - target: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hubcli-ci-package-${{ matrix.target }}
          path: pkg-source

      - name: generate checksums for the local source dir
        shell: bash
        run: bash script/hubcli/release/generate-checksums.sh pkg-source

      - name: install, verify, repair, uninstall (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          HUBCLI_INSTALL_SOURCE: ${{ github.workspace }}/pkg-source
        run: |
          set -euo pipefail
          FAKE_HOME="${RUNNER_TEMP}/installer-home-${{ matrix.target }}"
          BIN_DIR="${FAKE_HOME}/.local/bin"
          mkdir -p "$FAKE_HOME"

          echo "::group::fresh install"
          HOME="$FAKE_HOME" HUBCLI_BIN_DIR="$BIN_DIR" bash install.sh
          echo "::endgroup::"

          test -x "${BIN_DIR}/hubcli"          || { echo "launcher missing after install"; exit 1; }
          test -x "${BIN_DIR}/hubcli-runtime"  || { echo "runtime missing after install"; exit 1; }
          test -x "${BIN_DIR}/hubcli-fast"     || { echo "fast bin missing after install"; exit 1; }

          echo "::group::run the installed binary"
          HOME="$FAKE_HOME" "${BIN_DIR}/hubcli" --version
          HOME="$FAKE_HOME" "${BIN_DIR}/hubcli" --help >/dev/null
          HOME="$FAKE_HOME" "${BIN_DIR}/hubcli" doctor || true
          echo "::endgroup::"

          # Config/credentials must survive a --repair untouched.
          echo "DEEPSEEK_API_KEY=must-survive-repair" >> "${FAKE_HOME}/.hubcli/credentials.env"
          HOME="$FAKE_HOME" HUBCLI_BIN_DIR="$BIN_DIR" bash install.sh --check
          HOME="$FAKE_HOME" HUBCLI_BIN_DIR="$BIN_DIR" bash install.sh --repair
          grep -q "must-survive-repair" "${FAKE_HOME}/.hubcli/credentials.env" \
            || { echo "--repair destroyed user credentials"; exit 1; }

          # A bad checksum must abort without installing anything.
          echo "::group::checksum mismatch must abort"
          BAD_SRC="${RUNNER_TEMP}/bad-source-${{ matrix.target }}"
          BAD_HOME="${RUNNER_TEMP}/bad-home-${{ matrix.target }}"
          mkdir -p "$BAD_SRC" "$BAD_HOME"
          cp pkg-source/hubcli-${{ matrix.target }}.tar.gz "$BAD_SRC/"
          printf '%s  hubcli-%s.tar.gz\n' "$(printf '0%.0s' $(seq 64))" "${{ matrix.target }}" > "$BAD_SRC/checksums-sha256.txt"
          if HOME="$BAD_HOME" HUBCLI_BIN_DIR="${BAD_HOME}/bin" HUBCLI_INSTALL_SOURCE="$BAD_SRC" bash install.sh; then
            echo "installer accepted a bad checksum"; exit 1
          fi
          test ! -e "${BAD_HOME}/bin/hubcli" || { echo "installer left files behind after checksum failure"; exit 1; }
          echo "::endgroup::"

          # Uninstall removes binaries but never user data.
          HOME="$FAKE_HOME" HUBCLI_BIN_DIR="$BIN_DIR" bash install.sh --uninstall
          test ! -e "${BIN_DIR}/hubcli" || { echo "uninstall left the launcher behind"; exit 1; }
          grep -q "must-survive-repair" "${FAKE_HOME}/.hubcli/credentials.env" \
            || { echo "uninstall destroyed user credentials"; exit 1; }
          echo "installer verified end to end on ${{ matrix.target }}"

      - name: install, verify, repair, uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          HUBCLI_INSTALL_SOURCE: ${{ github.workspace }}\pkg-source
        run: |
          $ErrorActionPreference = "Stop"
          $fakeHome = Join-Path $env:RUNNER_TEMP "installer-home-windows"
          $binDir = Join-Path $fakeHome ".hubcli\bin"
          New-Item -ItemType Directory -Path $fakeHome -Force | Out-Null
          $env:USERPROFILE = $fakeHome

          Write-Output "::group::fresh install"
          & .\install.ps1 -InstallDir $binDir -NoPathPrompt
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          Write-Output "::endgroup::"

          foreach ($f in @("hubcli.cmd", "hubcli.ps1", "hubcli-runtime.exe", "hubcli-fast.exe")) {
            if (-not (Test-Path (Join-Path $binDir $f))) { throw "$f missing after install" }
          }

          Write-Output "::group::run the installed binary"
          $version = & (Join-Path $binDir "hubcli.cmd") --version
          if ($LASTEXITCODE -ne 0) { throw "hubcli --version exited $LASTEXITCODE" }
          if ([string]::IsNullOrWhiteSpace($version)) { throw "hubcli --version printed nothing" }
          Write-Output "version: $version"
          & (Join-Path $binDir "hubcli.cmd") --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "hubcli --help exited $LASTEXITCODE" }
          & (Join-Path $binDir "hubcli.cmd") doctor | Out-Null
          Write-Output "::endgroup::"

          # Config/credentials must survive a -Repair untouched.
          $creds = Join-Path $fakeHome ".hubcli\credentials.env"
          Add-Content -Path $creds -Value "DEEPSEEK_API_KEY=must-survive-repair"
          & .\install.ps1 -InstallDir $binDir -Check
          & .\install.ps1 -InstallDir $binDir -Repair -NoPathPrompt
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 -Repair exited $LASTEXITCODE" }
          if (-not (Select-String -Path $creds -Pattern "must-survive-repair" -Quiet)) {
            throw "-Repair destroyed user credentials"
          }

          # A bad checksum must abort without installing anything.
          Write-Output "::group::checksum mismatch must abort"
          $badSrc = Join-Path $env:RUNNER_TEMP "bad-source-windows"
          $badHome = Join-Path $env:RUNNER_TEMP "bad-home-windows"
          New-Item -ItemType Directory -Path $badSrc, $badHome -Force | Out-Null
          Copy-Item "pkg-source\hubcli-windows-x64.zip" $badSrc
          Set-Content -Path (Join-Path $badSrc "checksums-sha256.txt") `
            -Value ("0" * 64 + "  hubcli-windows-x64.zip")
          $savedSource = $env:HUBCLI_INSTALL_SOURCE
          $env:HUBCLI_INSTALL_SOURCE = $badSrc
          $global:LASTEXITCODE = 0
          & .\install.ps1 -InstallDir (Join-Path $badHome "bin") -NoPathPrompt
          if ($LASTEXITCODE -eq 0) { throw "installer accepted a bad checksum" }
          if (Test-Path (Join-Path $badHome "bin\hubcli.cmd")) {
            throw "installer left files behind after checksum failure"
          }
          $env:HUBCLI_INSTALL_SOURCE = $savedSource
          $global:LASTEXITCODE = 0
          Write-Output "::endgroup::"

          # Uninstall removes binaries but never user data.
          & .\install.ps1 -InstallDir $binDir -Uninstall
          if (Test-Path (Join-Path $binDir "hubcli.cmd")) { throw "uninstall left the launcher behind" }
          if (-not (Select-String -Path $creds -Pattern "must-survive-repair" -Quiet)) {
            throw "uninstall destroyed user credentials"
          }
          Write-Output "installer verified end to end on windows-x64"
